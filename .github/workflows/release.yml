name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish self-contained single-file exe
        run: >
          dotnet publish src/Hangly.Windows/Hangly.Windows.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - name: Zip the published app
        run: Compress-Archive -Path publish\* -DestinationPath Hangly.Windows.zip
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: Hangly.Windows
          path: Hangly.Windows.zip

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Hangly.Windows.zip
          generate_release_notes: true
